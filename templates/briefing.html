{% extends "base.html" %}

{% block title %}Flugwetter – Flychat{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/briefing.css') }}?v={{ static_v('css/briefing.css') }}">
{% endblock %}

{% block content %}
<div class="bf" id="briefingRoot">
  <header class="bf-header">
    <div class="bf-header-left">
      <h1 class="bf-logo">Flugwetter</h1>
      <span class="bf-date-range" id="bfDateRange">wird geladen…</span>
    </div>
    <div class="bf-header-right">
      <span class="bf-timestamp" id="bfGeneratedAt"></span>
      <button type="button" class="bf-btn-gen" id="bfGenerateBtn">Aktualisieren</button>
    </div>
  </header>

  <section class="bf-fazit" id="bfFazit" hidden></section>

  <nav class="bf-day-tabs" id="bfDayTabs" role="tablist" aria-label="Tagesauswahl"></nav>

  <section class="bf-filters" id="bfFilters">
    <div class="bf-filter-row">
      <div class="bf-filter-chips" id="bfFilterChips"></div>
      <button type="button" class="bf-filter-reset" id="bfFilterReset" disabled>Alle</button>
      <button type="button" class="bf-filter-map-btn" id="bfMapToggle" title="Karte ein/aus">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 3.5l4.5-2 5 2.5 4.5-2v11l-4.5 2-5-2.5-4.5 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.5 1.5v11M10.5 4v11" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
    <div class="bf-filter-map" id="bfFilterMap" hidden></div>
  </section>

  <div class="bf-day-info" id="bfDayInfo"></div>

  <section class="bf-content" id="bfContent"></section>

  <div class="tooltip" id="bfMeteogramTooltip"></div>

  <footer class="bf-footer">
    <p>ICON-D2/EU/CH1/CH2 + GFS via Open-Meteo · winds.mobi · Flychat-KI</p>
  </footer>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="{{ url_for('static', filename='js/meteogram.js') }}?v={{ static_v('js/meteogram.js') }}"></script>
<script src="{{ url_for('static', filename='js/briefing.js') }}?v={{ static_v('js/briefing.js') }}"></script>
{% endblock %}
