<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flychat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <a href="/chat" class="navbar-brand">Fly<span>chat</span></a>
        <div class="navbar-links">
            <a href="/chat" class="{% if request.path == '/' or request.path == '/chat' %}active{% endif %}">Chat</a>
            <a href="/analyses" class="{% if request.path == '/analyses' %}active{% endif %}">Analysen</a>
        </div>
    </nav>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>

</html>
