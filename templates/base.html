<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flychat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ static_v('css/style.css') }}">
    <!-- Error Monitor: muss als ERSTES JS laden, damit es Errors aller späteren Scripts abfängt -->
    <script src="{{ url_for('static', filename='js/error-monitor.js') }}?v={{ static_v('js/error-monitor.js') }}"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <a href="/chat" class="navbar-brand">Fly<span>chat</span></a>
        <div class="navbar-links">
            <a href="/chat" class="{% if request.path == '/' or request.path == '/chat' %}active{% endif %}">Startplätze</a>
            <a href="/regionen" class="{% if request.path == '/regionen' %}active{% endif %}">Regionen</a>
            <a href="/analyses" class="{% if request.path == '/analyses' %}active{% endif %}">Analysen</a>
            <button type="button" class="navbar-link-btn" id="navFoehnBtn" title="Föhndiagramm öffnen">Föhn</button>
        </div>
    </nav>
    {% block content %}{% endblock %}

    <!-- Foehn Diagram Overlay (shared across all pages) -->
    <div class="meteogram-overlay" id="foehnOverlay">
        <div class="meteogram-panel">
            <div class="meteogram-header">
                <div>
                    <h2>Föhndiagramm</h2>
                    <span class="spot-info">Druckdifferenz Lugano – Zürich | 5-Tage-Prognose</span>
                </div>
                <button class="meteogram-close" id="foehnClose">&times;</button>
            </div>
            <div class="meteogram-chart" id="foehnChart"></div>
        </div>
    </div>
    <div class="tooltip" id="foehnTooltip"></div>

    {% block scripts %}{% endblock %}
    <script>
        (function () {
            var foehnOverlay = document.getElementById('foehnOverlay');
            var foehnChart = document.getElementById('foehnChart');
            var foehnCloseBtn = document.getElementById('foehnClose');
            var foehnTooltip = document.getElementById('foehnTooltip');

            function openFoehn() {
                if (typeof FoehnDiagram === 'undefined') {
                    window.location.href = '/chat?foehn=1';
                    return;
                }
                foehnChart.innerHTML = '<div class="error-state">Lade Föhn-Daten...</div>';
                foehnOverlay.style.display = 'flex';
                foehnOverlay.classList.add('visible');

                fetch('/api/foehn')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.error) {
                            foehnChart.innerHTML = '<div class="error-state">' + data.error + '</div>';
                            return;
                        }
                        var dates = data.dates || [];
                        if (dates.length === 0) {
                            foehnChart.innerHTML = '<div class="error-state">Keine Föhn-Daten verfügbar.</div>';
                            return;
                        }
                        var allData = [];
                        dates.forEach(function (dateStr) {
                            var dayArr = data.data[dateStr] || [];
                            dayArr.forEach(function (entry) { allData.push(entry); });
                        });
                        FoehnDiagram.renderChart(foehnChart, foehnTooltip, allData, data.thresholds);
                    })
                    .catch(function (err) {
                        foehnChart.innerHTML = '<div class="error-state">Fehler: ' + err.message + '</div>';
                    });
            }

            function closeFoehn() {
                foehnOverlay.style.display = 'none';
                foehnOverlay.classList.remove('visible');
                foehnTooltip.classList.remove('visible');
            }

            foehnCloseBtn.addEventListener('click', closeFoehn);
            foehnOverlay.addEventListener('click', function (e) {
                if (e.target === foehnOverlay) closeFoehn();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && foehnOverlay.classList.contains('visible')) {
                    closeFoehn();
                }
            });

            window.openFoehn = openFoehn;

            // Auto-open if ?foehn=1 in URL
            try {
                if (new URLSearchParams(window.location.search).get('foehn') === '1') {
                    openFoehn();
                    history.replaceState({}, '', window.location.pathname);
                }
            } catch (e) { /* ignore */ }

            var btn = document.getElementById('navFoehnBtn');
            if (btn) {
                btn.addEventListener('click', function () {
                    openFoehn();
                });
            }
        })();
    </script>
</body>

</html>
