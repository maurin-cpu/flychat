{% extends "base.html" %}
{% block title %}Flychat - Analysen{% endblock %}

{% block head %}
<style>
    body {
        padding-top: 60px;
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2000;
        height: 60px;
    }

    .analyses-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
    }

    .analyses-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .analyses-header h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.3px;
    }

    .analyses-header h1 span {
        color: var(--color-text-muted);
        font-weight: 400;
        font-size: 0.85rem;
        margin-left: 8px;
    }

    .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    /* Run buttons use global .btn system from style.css */

    .status-bar {
        font-size: 12px;
        color: var(--color-text-muted);
    }

    /* Sub-Tabs */
    .sub-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 16px;
        padding: 3px;
        background: var(--glass-bg-light);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        width: fit-content;
    }

    .sub-tab {
        padding: 7px 20px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-fast);
        font-family: inherit;
    }

    .sub-tab:hover {
        color: var(--color-text);
        background: #f1f5f9;
    }

    .sub-tab.active {
        background: var(--color-primary-light);
        color: var(--color-primary);
    }

    /* Day Tabs */
    .day-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        padding: 4px;
        background: var(--glass-bg-light);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        width: fit-content;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .day-tab {
        padding: 8px 20px;
        border-radius: var(--radius-sm);
        border: none;
        background: transparent;
        color: var(--color-text-muted);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all var(--transition-fast);
        font-family: inherit;
        flex-shrink: 0;
    }

    .day-tab:hover {
        color: var(--color-text);
        background: #f1f5f9;
    }

    .day-tab.active {
        background: var(--color-primary-light);
        color: var(--color-primary);
    }

    .day-tab .day-label {
        display: block;
        font-size: 11px;
        color: var(--color-text-muted);
        margin-top: 2px;
    }

    .day-tab.active .day-label {
        color: var(--color-primary);
    }

    .empty-day-hint {
        padding: 24px;
        color: var(--color-text-muted);
        font-size: 14px;
        text-align: center;
        max-width: 480px;
    }

    /* Summary Bar */
    .day-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 20px;
        padding: 12px 18px;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
    }

    .summary-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
    }

    .summary-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }

    .summary-dot.safe { background: var(--color-safety-excellent); }
    .summary-dot.conditional { background: var(--color-safety-marginal); }
    .summary-dot.not_safe { background: var(--color-safety-critical); }
    .summary-dot.gray { background: var(--color-fly-gray); }
    .summary-dot.green { background: var(--color-safety-excellent); }
    .summary-dot.violet { background: var(--color-fly-violet); }
    .summary-dot.no_data { background: var(--color-safety-unknown); }
    .summary-dot.error { background: var(--color-safety-unknown); }

    /* Cards Grid */
    .spots-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr));
        gap: 16px;
    }

    .spot-card {
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 18px 20px;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-sm);
    }

    .spot-card:hover {
        transform: translateY(-2px);
        border-color: var(--color-border-hover);
        box-shadow: var(--shadow-md);
    }

    /* Spot card styles now in style.css — safety-* and fly-* classes handled there */

    .spot-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 12px;
    }

    .spot-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        max-width: 62%;
    }

    .spot-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.2px;
    }

    .spot-name .ref-info {
        font-size: 11px;
        font-weight: 400;
        color: var(--color-text-muted);
        display: block;
        margin-top: 2px;
    }

    .spot-status-badge {
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .badge-safety-safe { background: var(--color-safety-excellent-bg); color: var(--color-safety-excellent-text); }
    .badge-safety-conditional { background: var(--color-safety-marginal-bg); color: var(--color-safety-marginal-text); }
    .badge-safety-not_safe { background: var(--color-safety-critical-bg); color: var(--color-safety-critical-text); }
    .badge-safety-no_data { background: var(--color-safety-nodata-bg); color: var(--color-safety-nodata-text); }
    .badge-safety-error { background: #fee2e2; color: #b91c1c; }
    .badge-fly-gray { background: var(--color-fly-gray-bg); color: var(--color-fly-gray-text); }
    .badge-fly-green { background: var(--color-fly-green-bg); color: var(--color-fly-green-text); }
    .badge-fly-violet { background: var(--color-fly-violet-bg); color: var(--color-fly-violet-text); }

    .spot-card-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .spot-row {
        display: flex;
        gap: 8px;
        font-size: 12.5px;
        line-height: 1.5;
    }

    .spot-row-label {
        color: var(--color-text-muted);
        min-width: 90px;
        flex-shrink: 0;
        font-weight: 500;
    }

    .spot-row-value {
        color: var(--color-text-secondary);
    }

    .spot-recommendation {
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--glass-border);
        font-size: 12.5px;
        color: var(--color-text);
        line-height: 1.6;
    }

    .ai-feedback-box {
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: var(--radius-md);
        background: #f8fafc;
        border: 1px solid var(--color-border);
        font-size: 12px;
        line-height: 1.5;
        color: var(--color-text-light);
    }

    .ai-feedback-label {
        display: block;
        font-weight: 700;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
        color: var(--color-text-muted);
    }

    .ai-feedback-safety .ai-feedback-label { color: var(--color-primary); }
    .ai-feedback-flyability .ai-feedback-label { color: #059669; }

    .safety-issues {
        color: #EF4444;
        font-weight: 500;
    }

    .warning-list {
        list-style: none;
        padding: 0;
        margin: 4px 0 0 0;
    }

    .warning-list li {
        position: relative;
        padding: 2px 0 2px 16px;
        font-size: 12px;
        line-height: 1.4;
    }

    .warning-list li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        width: 8px;
        height: 8px;
        border-radius: 2px;
    }

    .warning-list.nogo-list li::before {
        background: var(--color-safety-critical);
    }

    .warning-list.caution-list li::before {
        background: var(--color-safety-marginal);
    }

    .warning-list.nogo-list li {
        color: var(--color-safety-critical-text);
        font-weight: 500;
    }

    .warning-list.caution-list li {
        color: var(--color-safety-marginal-text);
    }

    .warning-section {
        margin-top: 6px;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
    }

    .warning-section.nogo-section {
        background: #fef2f2;
        border: 1px solid #fecaca;
    }

    .warning-section.caution-section {
        background: #fffbeb;
        border: 1px solid #fde68a;
    }

    .warning-section-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .nogo-section .warning-section-label {
        color: #dc2626;
    }

    .caution-section .warning-section-label {
        color: #d97706;
    }

    .warning-none {
        font-size: 11px;
        color: #94a3b8;
        font-style: italic;
        margin-top: 2px;
    }

    /* ─── Smart-Labels (4-Kategorien-System) ──────────── */
    .smart-labels {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
    }

    .smart-label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: var(--radius-pill);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.3;
        border: 1px solid transparent;
    }

    .smart-label-icon {
        font-size: 12px;
        line-height: 1;
    }

    .smart-label.cat-no_go {
        background: #fee2e2;
        color: #991b1b;
        border-color: #fecaca;
    }

    .smart-label.cat-conditional {
        background: #fff7ed;
        color: #9a3412;
        border-color: #fed7aa;
    }

    .smart-label.cat-reducer {
        background: #F5EDE0;
        color: #6B5430;
        border-color: #D9C5A3;
    }

    .smart-label.cat-booster {
        background: #dcfce7;
        color: #166534;
        border-color: #bbf7d0;
    }

    /* Details-Akkordeon fuer Rohdaten-Listen */
    .details-toggle {
        margin-top: 8px;
        border-top: 1px dashed var(--glass-border);
        padding-top: 8px;
    }

    .details-toggle summary {
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 0;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .details-toggle summary::before {
        content: '▸';
        display: inline-block;
        transition: transform 0.15s;
        font-size: 9px;
    }

    .details-toggle[open] summary::before {
        transform: rotate(90deg);
    }

    .details-toggle summary:hover {
        color: var(--color-text);
    }

    .details-toggle[open] > div {
        margin-top: 6px;
    }

    .confidence-badge {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: var(--radius-pill);
        background: #f1f5f9;
        color: var(--color-text-muted);
        font-weight: 500;
        text-transform: uppercase;
    }

    /* Empty State */
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--color-text-muted);
    }

    .empty-state h2 {
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: var(--color-text-secondary);
    }

    .empty-state p {
        font-size: 13px;
        max-width: 400px;
        margin: 0 auto;
    }

    @media (max-width: 1023px) {
        .analyses-container { padding: 12px; }
        .spots-grid { grid-template-columns: 1fr; }
        .analyses-header { flex-direction: column; align-items: flex-start; gap: 12px; }
        .spot-card { padding: 14px; }
        .day-summary { gap: 8px; }
    }

    @media (max-width: 639px) {
        body {
            padding-top: 48px;
            padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
        }
        .navbar { height: 48px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="analyses-container">
    <div class="analyses-header">
        <h1>Analysen <span id="headerMeta"></span></h1>
        <div class="header-actions">
            <span class="status-bar" id="statusBar"></span>
            <button class="btn btn-primary" id="runSpotBtn">
                <span class="spinner"></span>
                <span class="btn-label">Spot-Analyse starten</span>
            </button>
            <button class="btn btn-primary" id="runRegionBtn" style="display: none;">
                <span class="spinner"></span>
                <span class="btn-label">Region-Analyse starten</span>
            </button>
        </div>
    </div>

    <!-- Sub-Tabs -->
    <div class="sub-tabs" id="subTabs">
        <button class="sub-tab active" data-view="spots">Startplätze</button>
        <button class="sub-tab" data-view="regions">Regionen</button>
    </div>

    <div class="day-tabs" id="dayTabs" style="display: none;"></div>
    <div class="day-summary" id="daySummary" style="display: none;"></div>

    <!-- Two grids, only one visible at a time -->
    <div class="spots-grid" id="spotsGrid"></div>
    <div class="spots-grid" id="regionsGrid" style="display: none;"></div>

    <div class="empty-state" id="emptyState">
        <h2>Keine Analysen vorhanden</h2>
        <p>Klicke "Analyse starten" um die LLM-Analyse durchzuführen.</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
import { init } from 'https://esm.sh/@instantdb/core';
import { pickDisplayLabels } from "{{ url_for('static', filename='js/label-catalog.js') }}";

const APP_ID = '{{ instantdb_app_id }}';
const FORECAST_DAYS = {{ forecast_days }};
const db = init({ appId: APP_ID });

function formatDayTabLabel(dateStr) {
    var d = new Date(dateStr + 'T12:00:00');
    var dayNames = ['SO', 'MO', 'DI', 'MI', 'DO', 'FR', 'SA'];
    var dd = String(d.getDate()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var yyyy = d.getFullYear();
    return dayNames[d.getDay()] + ' ' + dd + '.' + mm + '.' + yyyy;
}

function enumerateForecastDates() {
    var now = new Date();
    var out = [];
    for (var i = 0; i < FORECAST_DAYS; i++) {
        var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        out.push(
            d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        );
    }
    return out;
}

var dayTabs = document.getElementById('dayTabs');
var daySummary = document.getElementById('daySummary');
var spotsGrid = document.getElementById('spotsGrid');
var regionsGrid = document.getElementById('regionsGrid');
var emptyState = document.getElementById('emptyState');
var runSpotBtn = document.getElementById('runSpotBtn');
var runRegionBtn = document.getElementById('runRegionBtn');
var statusBar = document.getElementById('statusBar');
var headerMeta = document.getElementById('headerMeta');
var subTabsEl = document.getElementById('subTabs');

var spotAnalysesNested = {};
var regionAnalysesNested = {};
var spotLatestUpdatedAt = null;
var regionLatestUpdatedAt = null;
var currentDate = null;
var currentView = 'spots'; // 'spots' or 'regions'
var spotLoadedFromApi = false;
var regionLoadedFromApi = false;

var safetyLabels = {
    safe: 'Grün',
    conditional: 'Orange',
    not_safe: 'Rot',
    no_data: 'Keine Daten',
    error: 'Analyse-Fehler'
};

var flyTierLabels = {
    gray: 'Grau (Abgleiter)',
    green: 'Grün (fliegbar)',
    violet: 'Violett (legendär / XC)'
};

function normalizeFlyTier(ft) {
    if (!ft) return '';
    var k = String(ft).trim().toLowerCase();
    if (k === 'gray' || k === 'green' || k === 'violet') return k;
    if (k === 'yellow') return 'gray';
    if (k === 'orange') return 'green';
    return 'green';
}

// ─── Sub-Tab Switch ─────────────────────────────────────────────
subTabsEl.addEventListener('click', function(e) {
    var btn = e.target.closest('.sub-tab');
    if (!btn) return;
    var view = btn.getAttribute('data-view');
    if (view === currentView) return;

    currentView = view;
    subTabsEl.querySelectorAll('.sub-tab').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');

    if (view === 'spots') {
        runSpotBtn.style.display = '';
        runRegionBtn.style.display = 'none';
    } else {
        runSpotBtn.style.display = 'none';
        runRegionBtn.style.display = '';
    }

    render();
});

// ─── Primary: API fetch (sofort verfügbar, kein InstantDB nötig) ─────
fetch('/api/analyses').then(function(r) { return r.json(); }).then(function(data) {
    if (data.spot_analyses) {
        var nested = data.spot_analyses;
        // API gibt nested {spotName: {date: doc}} zurück — direkt übernehmen
        spotAnalysesNested = nested;
        spotLoadedFromApi = true;
        if (data.spot_analyses) {
            var allDocs = [];
            Object.values(nested).forEach(function(days) { Object.values(days).forEach(function(d) { allDocs.push(d); }); });
            allDocs.forEach(function(d) {
                if (d.updated_at && (!spotLatestUpdatedAt || d.updated_at > spotLatestUpdatedAt)) {
                    spotLatestUpdatedAt = d.updated_at;
                }
            });
        }
        render();
    }
}).catch(function(e) { console.warn('API spot analyses fetch failed:', e); });

fetch('/api/region-analyses').then(function(r) { return r.json(); }).then(function(data) {
    if (data.region_analyses) {
        regionAnalysesNested = data.region_analyses;
        regionLoadedFromApi = true;
        Object.values(data.region_analyses).forEach(function(days) {
            Object.values(days).forEach(function(d) {
                if (d.updated_at && (!regionLatestUpdatedAt || d.updated_at > regionLatestUpdatedAt)) {
                    regionLatestUpdatedAt = d.updated_at;
                }
            });
        });
        render();
    }
}).catch(function(e) { console.warn('API region analyses fetch failed:', e); });

// ─── Secondary: InstantDB subscriptions for live updates ────────
db.subscribeQuery({ spot_analyses: {} }, function(resp) {
    if (resp.error) {
        console.error('InstantDB Spot-Fehler:', resp.error.message);
        return;
    }
    if (resp.data) {
        var entries = resp.data.spot_analyses || [];
        // Leere InstantDB-Antwort überschreibt nicht die API-Daten
        if (entries.length === 0 && spotLoadedFromApi) return;
        spotAnalysesNested = {};
        spotLatestUpdatedAt = null;
        entries.forEach(function(entry) {
            var spotName = entry.spot;
            var dateStr = entry.date;
            if (!spotName || !dateStr) return;
            ['no_go_reasons', 'caution_notes'].forEach(function(key) {
                if (typeof entry[key] === 'string') {
                    try { entry[key] = JSON.parse(entry[key]); }
                    catch(e) { entry[key] = entry[key] ? [entry[key]] : []; }
                }
            });
            if (!spotAnalysesNested[spotName]) spotAnalysesNested[spotName] = {};
            spotAnalysesNested[spotName][dateStr] = entry;
            if (entry.updated_at && (!spotLatestUpdatedAt || entry.updated_at > spotLatestUpdatedAt)) {
                spotLatestUpdatedAt = entry.updated_at;
            }
        });
        render();
    }
});

// ─── InstantDB: Region Analyses ─────────────────────────────────
db.subscribeQuery({ region_analyses: {} }, function(resp) {
    if (resp.error) {
        console.error('InstantDB Region-Fehler:', resp.error.message);
        return;
    }
    if (resp.data) {
        var entries = resp.data.region_analyses || [];
        // Leere InstantDB-Antwort überschreibt nicht die API-Daten
        if (entries.length === 0 && regionLoadedFromApi) return;
        regionAnalysesNested = {};
        regionLatestUpdatedAt = null;
        entries.forEach(function(entry) {
            var regionId = entry.region_id;
            var dateStr = entry.date;
            if (!regionId || !dateStr) return;
            ['no_go_reasons', 'caution_notes'].forEach(function(key) {
                if (typeof entry[key] === 'string') {
                    try { entry[key] = JSON.parse(entry[key]); }
                    catch(e) { entry[key] = entry[key] ? [entry[key]] : []; }
                }
            });
            if (!regionAnalysesNested[regionId]) regionAnalysesNested[regionId] = {};
            regionAnalysesNested[regionId][dateStr] = entry;
            if (entry.updated_at && (!regionLatestUpdatedAt || entry.updated_at > regionLatestUpdatedAt)) {
                regionLatestUpdatedAt = entry.updated_at;
            }
        });
        render();
    }
});

// ─── Rendering ─────────────────────────────────────────────────
function render() {
    var activeNested = currentView === 'spots' ? spotAnalysesNested : regionAnalysesNested;
    var activeLatest = currentView === 'spots' ? spotLatestUpdatedAt : regionLatestUpdatedAt;
    var activeGrid = currentView === 'spots' ? spotsGrid : regionsGrid;
    var hiddenGrid = currentView === 'spots' ? regionsGrid : spotsGrid;

    activeGrid.style.display = '';
    hiddenGrid.style.display = 'none';

    var keys = Object.keys(activeNested);
    if (keys.length === 0) {
        emptyState.style.display = 'block';
        dayTabs.style.display = 'none';
        daySummary.style.display = 'none';
        activeGrid.innerHTML = '';
        headerMeta.textContent = '';
        statusBar.textContent = 'Keine Daten in InstantDB';
        return;
    }

    emptyState.style.display = 'none';

    if (activeLatest) {
        var d = new Date(activeLatest);
        statusBar.textContent = 'Stand: ' + d.toLocaleString('de-CH');
    }

    var sortedDates = enumerateForecastDates();
    var label = currentView === 'spots' ? ' Spots' : ' Regionen';
    headerMeta.textContent = keys.length + label + ', ' + FORECAST_DAYS + ' Tage';

    if (!currentDate || !sortedDates.includes(currentDate)) {
        currentDate = sortedDates[0];
    }

    renderDayTabs(sortedDates);
    renderDaySummary(activeNested);
    renderCards(activeNested, activeGrid);
}

function renderDayTabs(dates) {
    dayTabs.style.display = 'flex';
    dayTabs.innerHTML = '';
    dates.forEach(function(dateStr) {
        var btn = document.createElement('button');
        btn.className = 'day-tab' + (dateStr === currentDate ? ' active' : '');
        btn.innerHTML = '<span class="day-label">' + formatDayTabLabel(dateStr) + '</span>';
        btn.addEventListener('click', function() {
            currentDate = dateStr;
            render();
        });
        dayTabs.appendChild(btn);
    });
}

function renderDaySummary(activeNested) {
    daySummary.style.display = 'flex';
    daySummary.innerHTML = '';

    var safetyC = { safe: 0, conditional: 0, not_safe: 0, no_data: 0 };
    var flyC = { gray: 0, green: 0, violet: 0 };
    var errN = 0;
    Object.values(activeNested).forEach(function(days) {
        var a = days[currentDate];
        if (!a) return;
        var ss = a.safety_status || 'error';
        if (safetyC[ss] !== undefined) safetyC[ss]++;
        else errN++;
        var ft = (ss !== 'not_safe' && ss !== 'no_data' && ss !== 'error') ? normalizeFlyTier(a.fly_status || '') : '';
        if (ft && flyC[ft] !== undefined) flyC[ft]++;
    });

    function addChip(dotClass, n, label) {
        if (n === 0) return;
        var chip = document.createElement('div');
        chip.className = 'summary-chip';
        chip.innerHTML = '<span class="summary-dot ' + dotClass + '"></span>' + n + ' ' + label;
        daySummary.appendChild(chip);
    }
    addChip('safe', safetyC.safe, 'Sich. Grün');
    addChip('conditional', safetyC.conditional, 'Sich. Orange');
    addChip('not_safe', safetyC.not_safe, 'Sich. Rot');
    addChip('no_data', safetyC.no_data, 'Keine Daten');
    addChip('violet', flyC.violet, 'Flug legendär');
    addChip('green', flyC.green, 'Flug fliegbar');
    addChip('gray', flyC.gray, 'Flug Abgleiter');
    if (errN > 0) addChip('error', errN, 'Fehler');
}

function renderCards(activeNested, grid) {
    grid.innerHTML = '';
    var keys = Object.keys(activeNested).sort();

    var flyOrder = { violet: 0, green: 1, gray: 2 };
    var safetyOrder = { safe: 0, conditional: 1, not_safe: 2, no_data: 3, error: 4 };
    keys.sort(function(a, b) {
        var xa = (activeNested[a] || {})[currentDate] || {};
        var xb = (activeNested[b] || {})[currentDate] || {};
        var fa = (xa.safety_status === 'not_safe' || xa.safety_status === 'error') ? '' : (xa.fly_status || '');
        var fb = (xb.safety_status === 'not_safe' || xb.safety_status === 'error') ? '' : (xb.fly_status || '');
        var oa = fa && flyOrder[fa] !== undefined ? flyOrder[fa] : 9;
        var ob = fb && flyOrder[fb] !== undefined ? flyOrder[fb] : 9;
        if (oa !== ob) return oa - ob;
        var sa = xa.safety_status || 'error';
        var sb = xb.safety_status || 'error';
        return (safetyOrder[sa] ?? 9) - (safetyOrder[sb] ?? 9);
    });

    var anyCard = false;
    keys.forEach(function(key) {
        var analysis = (activeNested[key] || {})[currentDate];
        if (!analysis) return;
        anyCard = true;
        var displayName = currentView === 'regions' ? (analysis.region_name || key) : key;
        grid.appendChild(createCard(displayName, analysis));
    });
    if (!anyCard) {
        var hint = document.createElement('div');
        hint.className = 'empty-day-hint';
        hint.textContent = 'Fuer diesen Tag liegt noch keine Analyse vor. Analyse starten oder Wetter aktualisieren.';
        grid.appendChild(hint);
    }
}

function createCard(name, a) {
    var safetyStatus = a.safety_status || 'error';
    var hasFlyData = !!(a.flyability_tier || a.fly_status);
    var phase2Ok = (safetyStatus === 'safe' || safetyStatus === 'conditional') && hasFlyData;
    var isRegion = (currentView === 'regions');

    var card = document.createElement('div');
    card.className = 'spot-card safety-' + safetyStatus;

    var safetyBadgeClass = 'badge-safety-' + safetyStatus;
    var safetyBadgeText = (safetyLabels[safetyStatus] || safetyStatus);

    var noGoReasons = a.no_go_reasons || [];
    if (typeof noGoReasons === 'string') {
        try { noGoReasons = JSON.parse(noGoReasons); } catch(e) { noGoReasons = noGoReasons ? [noGoReasons] : []; }
    }
    var cautionNotes = a.caution_notes || [];
    if (typeof cautionNotes === 'string') {
        try { cautionNotes = JSON.parse(cautionNotes); } catch(e) { cautionNotes = cautionNotes ? [cautionNotes] : []; }
    }

    var html = '<div class="spot-card-header">' +
        '<div style="display: flex; flex-direction: column; gap: 4px;">' +
        '<span class="spot-name">' + escHtml(name) + '</span>';

    // Fliegbarkeits-Badge (gray/green/violet) — nur wenn Daten vorhanden
    if (isRegion) {
        if (safetyStatus !== 'not_safe' && hasFlyData) {
            var ft = normalizeFlyTier(a.flyability_tier || a.fly_status || '');
            var regionBadgeLabels = { gray: 'Abgleiter', green: 'Gut', violet: 'Top' };
            var regionBadgeColors = { gray: '#64748b', green: '#166534', violet: '#6d28d9' };
            var regionBadgeBg = { gray: '#f1f5f9', green: '#dcfce7', violet: '#ede9fe' };
            var rlabel = regionBadgeLabels[ft] || ft;
            var rcolor = regionBadgeColors[ft] || '#64748b';
            var rbg = regionBadgeBg[ft] || '#f1f5f9';
            html += '<span style="font-size: 12px; font-weight: 600; color: ' + rcolor + '; background: ' + rbg + '; padding: 3px 10px; border-radius: 100px;">' + rlabel + '</span>';
        }
    } else {
        if (hasFlyData) {
            var flyStatus = a.fly_status || 'gray';
            var flyBadgeClass = 'badge-fly-' + flyStatus;
            var flyLabels = { gray: 'Abgleiter', green: 'Fliegbar', violet: 'Legendär' };
            var flyBadgeText = flyLabels[flyStatus] || flyStatus;
            html += '<span class="spot-status-badge ' + flyBadgeClass + '">' + escHtml(flyBadgeText) + '</span>';
        }
    }

    // Smart-Labels (max 1 bei not_safe, bis 3 bei conditional, bis 2 bei safe)
    var smartLabels = pickDisplayLabels(a);
    if (smartLabels.length > 0) {
        html += '<div class="smart-labels">';
        smartLabels.forEach(function(lbl) {
            html += '<span class="smart-label cat-' + lbl.category + '">' +
                    '<span class="smart-label-icon">' + lbl.icon + '</span>' +
                    escHtml(lbl.label) + '</span>';
        });
        html += '</div>';
    }

    html += '</div>' +
        '<span class="spot-badges">' +
        '<span class="spot-status-badge ' + safetyBadgeClass + '">' + escHtml(safetyBadgeText) + '</span>' +
        '</span></div>';

    if (safetyStatus === 'no_data') {
        html += '<div class="spot-card-body">' +
            '<div class="spot-row"><span class="spot-row-label">Status</span><span class="spot-row-value" style="color: #F97316;">Wetterdaten unvollstaendig</span></div>' +
            '<div class="spot-row"><span class="spot-row-label">Info</span><span class="spot-row-value">' + escHtml(a.safety_feedback || 'Keine KI-Analyse moeglich') + '</span></div>' +
            '</div>';
        card.innerHTML = html;
        return card;
    }

    if (safetyStatus === 'error') {
        var errMsg = a.error || 'Analyse fehlgeschlagen';
        var errHint = 'Bitte Analyse erneut starten.';
        html += '<div class="spot-card-body">' +
            '<div class="spot-row"><span class="spot-row-label">\u26A0 Fehler</span><span class="spot-row-value" style="color:#b91c1c;">' + escHtml(errMsg) + '</span></div>' +
            '<div class="spot-row"><span class="spot-row-label"></span><span class="spot-row-value" style="font-size:11px;color:#6b7280;">' + errHint + '</span></div>' +
            '</div>';
        card.innerHTML = html;
        return card;
    }

    html += '<div class="spot-card-body">';

    html += row('Sicherheit', safetyLabels[safetyStatus] || safetyStatus);
    html += row('Fenster', a.safe_window || a.best_window || '-');
    html += row('Wind', a.wind_summary || '-');
    if (a.foehn_risk && a.foehn_risk !== 'none') {
        html += row('Foehn', a.foehn_risk);
    }
    // Detail-Akkordeon: nur wenn mindestens eine Liste Eintraege hat
    if (noGoReasons.length > 0 || cautionNotes.length > 0) {
        html += '<details class="details-toggle">';
        html += '<summary>Details anzeigen</summary><div>';
        if (noGoReasons.length > 0) {
            html += '<div class="warning-section nogo-section">';
            html += '<span class="warning-section-label">NO-GO</span>';
            html += '<ul class="warning-list nogo-list">';
            noGoReasons.forEach(function(r) { html += '<li>' + escHtml(r) + '</li>'; });
            html += '</ul></div>';
        }
        if (cautionNotes.length > 0) {
            html += '<div class="warning-section caution-section">';
            html += '<span class="warning-section-label">Vorsicht</span>';
            html += '<ul class="warning-list caution-list">';
            cautionNotes.forEach(function(n) { html += '<li>' + escHtml(n) + '</li>'; });
            html += '</ul></div>';
        }
        html += '</div></details>';
    }

    if (phase2Ok) {
        html += '<div style="margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--glass-border);">';

        if (isRegion) {
            var regionFt = normalizeFlyTier(a.flyability_tier || a.fly_status || '');
            var regionQualLabels = { gray: 'Abgleiter', green: 'Gut', violet: 'Top' };
            html += row('Flugqualität', regionQualLabels[regionFt] || regionFt);
        } else {
            var flyStatus = normalizeFlyTier(a.fly_status || '');
            var flyLabels = { gray: 'Abgleiter', green: 'Gut fliegbar', violet: 'Legendär' };
            html += row('Flugqualität', flyLabels[flyStatus] || flyStatus);
        }

        html += row('Flugtyp', a.flight_type || '-');
        html += row('Dauer', a.flight_duration_estimate || a.flight_duration || '-');
        html += row('XC', a.xc_potential || '-');
        if (a.peak_climb_rate) {
            html += row('Peak', a.peak_climb_rate + ' m/s');
        }
        html += '</div>';
    } else if (safetyStatus === 'safe' || safetyStatus === 'conditional') {
        // Safety ok but no flyability data — show why
        var flyErr = a.fly_error || 'Fliegbarkeits-Analyse ausstehend';
        html += '<div style="margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--glass-border);">' +
            '<div class="spot-row"><span class="spot-row-label">Flugqualität</span>' +
            '<span class="spot-row-value" style="color: #9ca3af; font-style: italic;">' + escHtml(flyErr) + '</span></div>' +
            '</div>';
    }

    var safetyFeedback = a.safety_feedback || a.summary || '';
    if (safetyFeedback) {
        html += '<div class="ai-feedback-box ai-feedback-safety">' +
            '<span class="ai-feedback-label">KI-Feedback: Sicherheit</span>' +
            escHtml(safetyFeedback) +
            '</div>';
    }

    var flyFeedback = phase2Ok ? (a.flyability_feedback || a.recommendation || '') : '';
    if (flyFeedback) {
        html += '<div class="ai-feedback-box ai-feedback-flyability">' +
            '<span class="ai-feedback-label">KI-Feedback: Fliegbarkeit</span>' +
            escHtml(flyFeedback) +
            '</div>';
    }

    if (a.updated_at) {
        var d = new Date(a.updated_at);
        var ts = d.toLocaleDateString('de-CH') + ' ' + d.toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'});
        html += '<div style="margin-top:8px;font-size:10px;color:#94a3b8;text-align:right;">Analyse: ' + ts + '</div>';
    }

    html += '</div>';

    card.innerHTML = html;
    return card;
}

function row(label, value) {
    return '<div class="spot-row"><span class="spot-row-label">' + escHtml(label) + '</span><span class="spot-row-value">' + escHtml(value) + '</span></div>';
}

function escHtml(str) {
    if (str === null || str === undefined) return '';
    var div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
}

// ─── Run Buttons ────────────────────────────────────────────────
runSpotBtn.addEventListener('click', function() {
    if (runSpotBtn.disabled) return;
    runSpotBtn.disabled = true;
    runSpotBtn.classList.add('loading');
    statusBar.textContent = 'Spot-Analyse laeuft...';

    fetch('/api/run-analyses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            if (data.success) {
                statusBar.textContent = data.results_count + ' Spot-Analysen abgeschlossen';
            } else {
                statusBar.textContent = 'Fehler: ' + (data.error || 'Unbekannt');
            }
        })
        .catch(function(err) {
            statusBar.textContent = 'Fehler: ' + err.message;
        })
        .finally(function() {
            runSpotBtn.disabled = false;
            runSpotBtn.classList.remove('loading');
        });
});

runRegionBtn.addEventListener('click', function() {
    if (runRegionBtn.disabled) return;
    runRegionBtn.disabled = true;
    runRegionBtn.classList.add('loading');
    statusBar.textContent = 'Region-Analyse laeuft...';

    fetch('/api/run-region-analyses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
        .then(function(resp) { return resp.json(); })
        .then(function(data) {
            if (data.success) {
                statusBar.textContent = data.results_count + ' Region-Analysen abgeschlossen';
            } else {
                statusBar.textContent = 'Fehler: ' + (data.error || 'Unbekannt');
            }
        })
        .catch(function(err) {
            statusBar.textContent = 'Fehler: ' + err.message;
        })
        .finally(function() {
            runRegionBtn.disabled = false;
            runRegionBtn.classList.remove('loading');
        });
});
</script>
{% endblock %}
