{% extends "base.html" %}
{% block title %}Gleitcast - Regionen{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    /* ── Leaflet Tooltip (Light) ──────────────────────────── */
    .leaflet-tooltip.region-tooltip {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(0, 0, 0, 0.12);
        color: #1e293b;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        line-height: 1.45;
        padding: 6px 10px;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    .leaflet-tooltip.region-tooltip::before {
        display: none;
    }

    .region-label {
        background: transparent !important;
        border: none !important;
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2000;
        height: 60px;
    }

    body {
        padding-top: 60px;
        overflow: hidden;
        height: 100dvh;
        display: flex;
        flex-direction: column;
    }

    #main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }

    /* ── Unified Layout (Chat + Map) ─────────────────────── */
    .unified-layout {
        display: flex;
        flex: 1;
        overflow: hidden;
        min-height: 0;
    }

    .chat-sidebar {
        width: min(600px, max(480px, 38vw));
        min-width: 300px;
        max-width: min(720px, 92vw);
        flex-shrink: 0;
        border-right: 1px solid var(--color-border);
        display: flex;
        flex-direction: column;
        background: var(--color-bg);
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .map-main {
        flex: 1;
        position: relative;
        min-width: 0;
    }

    .chat-container {
        height: 100%;
        max-width: none;
        margin: 0;
        padding: 16px 20px 18px;
        min-width: 0;
        border-radius: 0;
        box-shadow: none;
        display: flex;
        flex-direction: column;
    }

    .resizer {
        width: 12px;
        background: transparent;
        cursor: col-resize;
        transition: background var(--transition-fast);
        z-index: 2001;
        position: relative;
    }

    .region-map-wrapper {
        flex: 1;
        position: relative;
        width: 100%;
        height: 100%;
    }

    #regionMap {
        height: 100%;
        width: 100%;
    }

    /* Floating controls: use shared .floating-control / .floating-day-tabs from style.css */

    .chat-header-actions {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    @media (max-width: 1023px) {
        .unified-layout { flex-direction: column; }
        .chat-sidebar {
            width: 100% !important;
            height: 50%;
            border-right: none;
            border-bottom: 1px solid var(--glass-border);
        }
        .resizer {
            width: 100%;
            height: 5px;
            cursor: row-resize;
        }
    }

    @media (max-width: 639px) {
        .unified-layout { flex-direction: column; }
        .chat-sidebar {
            width: 100% !important;
            min-width: 0 !important;
            max-width: none !important;
            flex: 1 1 0;
            min-height: 0;
            height: auto !important;
            border-right: none;
            display: none;
        }
        .map-main {
            display: block;
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }
        .resizer { display: none; }
        .unified-layout.show-chat .chat-sidebar { display: flex !important; }
        .unified-layout.show-chat .map-main { display: none !important; }
        .unified-layout.show-map .chat-sidebar { display: none !important; }
        .unified-layout.show-map .map-main { display: block !important; }
    }

    /* ── Status Bar ──────────────────────────────────────── */
    /* "Stand: <Datum/Zeit>" oben rechts in der Ecke. Desktop dezent
       (kleine grau-blau Pill), Mobile noch zurueckhaltender (kleinere
       Schrift, transparenter), damit sie weder Karte noch Tagesauswahl
       verdeckt. Position absolute relativ zur .region-map-wrapper. */
    .floating-status {
        top: 8px;
        right: 8px;
        font-size: 11px;
        color: #475569;
        padding: 4px 10px;
        border-radius: 8px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.78);
    }

    .floating-status:empty { display: none; }

    /* ── Region Overlay (Light) ───────────────────────────── */
    #regionOverlay .meteogram-panel {
        max-width: 1800px;
        width: 96vw;
        height: 92vh;
        border-radius: 16px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
    }

    #regionOverlay .meteogram-header {
        padding: 18px 24px 14px;
        background: #fafafa;
        border-bottom: 1px solid #e5e7eb;
    }

    #regionOverlay .meteogram-header h2 {
        color: #1e293b;
    }

    #regionOverlay .meteogram-close {
        color: #64748b;
        border-color: #e5e7eb;
    }

    #regionOverlay .meteogram-close:hover {
        background: #f1f5f9;
        color: #1e293b;
    }

    #regionOverlay .meteogram-share {
        color: #64748b;
        border-color: #e5e7eb;
    }

    #regionOverlay .meteogram-share:hover,
    #regionOverlay .meteogram-share:focus-visible {
        background: #25D366;
        border-color: #25D366;
        color: #fff;
    }

    #regionOverlayBody {
        max-height: 75vh;
        overflow-y: auto;
        padding: 0 24px 20px;
    }

    /* Overlay-level day tabs */
    .region-overlay-day-tabs {
        display: flex;
        gap: 4px;
        padding: 0 24px 12px;
        flex-wrap: wrap;
    }

    .region-overlay-day-tabs .tab-btn {
        padding: 6px 14px;
        border-radius: 7px;
        border: 1px solid #e2e8f0;
        background: #f8fafc;
        color: #64748b;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
    }

    .region-overlay-day-tabs .tab-btn:hover {
        background: #f1f5f9;
        color: #1e293b;
    }

    .region-overlay-day-tabs .tab-btn.active {
        background: #0369a1;
        color: #fff;
        border-color: #0369a1;
    }

    /* Region overlay layout: analysis + meteogram side by side on wide screens */
    .region-overlay-content {
        display: flex;
        gap: 24px;
    }

    .region-overlay-analysis {
        flex: 0 0 340px;
        min-width: 280px;
    }

    .region-overlay-meteogram {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
    }

    .region-meteogram-chart {
        min-height: 200px;
        position: relative;
    }

    .region-meteogram-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
        color: #94a3b8;
        font-size: 13px;
    }

    .region-meteogram-spot-label {
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 8px;
    }

    @media (max-width: 1023px) {
        .region-overlay-content {
            flex-direction: column;
        }
        .region-overlay-analysis {
            flex: none;
            min-width: 0;
        }
    }

    @media (max-width: 639px) {
        body {
            padding-top: 48px;
            padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
            height: 100dvh;
        }
        .navbar { height: 48px; }
        /* Mobile: noch unauffaelliger oben rechts, kein Ueberdecken der
           Tagesauswahl-Pille (top: var(--space-4)). */
        .floating-status {
            top: 4px;
            right: 6px;
            font-size: 9px;
            padding: 2px 6px;
            opacity: 0.75;
            background: rgba(255, 255, 255, 0.6);
        }
        #regionOverlay .meteogram-panel { max-width: 100vw; width: 100vw; height: 100dvh; border-radius: 0; }
        #regionOverlayBody { padding: 0 16px 16px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="unified-layout">
    <!-- Links: Chat -->
    <aside class="chat-sidebar" id="chatSidebar">
        <div class="chat-container">
            <div class="chat-header">
                <span class="chat-title">Chat-Berater</span>
                <span class="data-freshness" id="dataFreshness" title="Alter der Wetterdaten"></span>
                <div class="chat-header-actions">
                    <button id="resetChatBtn" class="btn btn-danger btn-sm" aria-label="Neuen Chat starten">
                        <span>↺</span> Neuer Chat
                    </button>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages" style="overflow-x: hidden;" aria-live="polite" aria-relevant="additions">
                <div id="morningBriefing" style="display:none;"></div>
                <div class="chat-message bot">
                    Hallo! Ich bin dein Gleitcast-Berater. Frag mich zu Flugbedingungen, Gebietswahl oder Sicherheit.
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <div class="quick-actions" id="quickActions">
                <button class="quick-btn" data-msg="Wo kann ich heute fliegen?">Wo fliegen?</button>
                <button class="quick-btn" data-msg="Wie sind die Bedingungen heute?">Heute?</button>
                <button class="quick-btn" data-msg="Gibt es Föhn-Gefahr?">Föhn?</button>
            </div>

            <div class="chat-input-area">
                <label for="chatInput" class="sr-only">Nachricht eingeben</label>
                <textarea rows="1" class="chat-input" id="chatInput" placeholder="Frag mich..." autocomplete="off"></textarea>
                <button class="chat-send-btn" id="chatSendBtn" aria-label="Nachricht senden">
                    <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    <span class="send-label">Senden</span>
                </button>
            </div>
        </div>
    </aside>

    <div class="resizer" id="resizer"></div>

    <!-- Rechts: Karte -->
    <main class="map-main">
        <div class="region-map-wrapper">
            <div id="regionMap"></div>

            <!-- Floating Day Tabs (overlay on map, below navbar) -->
            <div class="floating-control floating-day-tabs" id="navDayTabs"></div>

            <!-- Floating Status -->
            <div class="floating-control floating-status" id="statusBar"></div>

            <!-- Meteogram Tooltip -->
            <div class="tooltip" id="regionMeteogramTooltip"></div>

            <!-- Region Analysis Overlay -->
            <div class="meteogram-overlay" id="regionOverlay" role="dialog" aria-modal="true" aria-label="Region-Analyse">
                <div class="meteogram-panel">
                    <div class="overlay-swipe-handle"></div>
                    <div class="meteogram-header">
                        <div>
                            <h2 id="regionOverlayTitle">Region</h2>
                        </div>
                        <button class="meteogram-share" id="regionOverlayShare" type="button" aria-label="Region teilen" title="Teilen (WhatsApp)">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        </button>
                        <button class="meteogram-close" id="regionOverlayClose" aria-label="Schliessen">&times;</button>
                    </div>
                    <div id="regionOverlayBody"></div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script defer src="{{ url_for('static', filename='js/meteogram.js') }}?v={{ static_v('js/meteogram.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/foehn_diagram.js') }}?v={{ static_v('js/foehn_diagram.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/region-map.js') }}?v={{ static_v('js/region-map.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/chat-charts.js') }}?v={{ static_v('js/chat-charts.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/chat.js') }}?v={{ static_v('js/chat.js') }}"></script>
<script>
(function () {
    var STORAGE_KEY = 'gleitcast_sidebar_width';
    var resizer = document.getElementById('resizer');
    var sidebar = document.getElementById('chatSidebar');
    var layout = document.querySelector('.unified-layout');
    var isDragging = false;
    var MIN_SIDEBAR_W = 300;

    function idealChatWidth() {
        var w = window.innerWidth;
        if (w <= 900) return null;
        return Math.round(Math.min(640, Math.max(500, w * 0.39)));
    }

    function applyInitialSidebarWidth() {
        if (!sidebar || window.innerWidth < 1024) return;
        var stored = parseInt(localStorage.getItem(STORAGE_KEY), 10);
        if (stored && stored >= MIN_SIDEBAR_W) {
            sidebar.style.width = stored + 'px';
            return;
        }
        var ideal = idealChatWidth();
        if (ideal) sidebar.style.width = ideal + 'px';
    }
    applyInitialSidebarWidth();

    if (resizer && sidebar) {
        resizer.addEventListener('mousedown', function () {
            isDragging = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            resizer.classList.add('dragging');
        });
        document.addEventListener('mousemove', function (e) {
            if (!isDragging) return;
            var newW = Math.max(MIN_SIDEBAR_W, Math.min(window.innerWidth * 0.92, e.clientX));
            sidebar.style.width = newW + 'px';
            if (window.regionMap && window.regionMap.invalidateSize) window.regionMap.invalidateSize();
        });
        document.addEventListener('mouseup', function () {
            if (!isDragging) return;
            isDragging = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            resizer.classList.remove('dragging');
            var w = parseInt(sidebar.style.width, 10);
            if (w && w >= MIN_SIDEBAR_W) localStorage.setItem(STORAGE_KEY, String(w));
            if (window.regionMap && window.regionMap.invalidateSize) window.regionMap.invalidateSize();
        });
    }

    // Mobile toggle (Chat / Regionen-Karte) via bottom nav
    var mobileNav = document.getElementById('mobileNav');
    if (mobileNav && layout) {
        var initialView = 'map';
        try {
            var v = new URLSearchParams(window.location.search).get('view');
            if (v === 'chat' || v === 'map') {
                initialView = v;
                history.replaceState({}, '', window.location.pathname);
            }
        } catch (e) { /* ignore */ }

        function switchMobileView(target) {
            if (target !== 'chat' && target !== 'map') return;
            mobileNav.querySelectorAll('.mobile-nav-item[data-target]').forEach(function (b) {
                b.classList.remove('active');
            });
            var activeBtn = mobileNav.querySelector('.mobile-nav-item[data-target="' + target + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            layout.classList.remove('show-chat', 'show-map');
            layout.classList.add('show-' + target);
            if (target === 'map' && window.regionMap && window.regionMap.invalidateSize) {
                setTimeout(function () { window.regionMap.invalidateSize(); }, 50);
            }
        }

        if (window.innerWidth < 640) {
            switchMobileView(initialView);
        }

        mobileNav.addEventListener('click', function (e) {
            var btn = e.target.closest('.mobile-nav-item[data-target]');
            if (!btn) return;
            switchMobileView(btn.getAttribute('data-target'));
        });
    }
})();
</script>
<script>
function normalizeFlyTier(ft) {
    if (!ft) return '';
    var k = String(ft).trim().toLowerCase();
    if (k === 'gray' || k === 'green' || k === 'violet') return k;
    if (k === 'yellow') return 'gray';
    if (k === 'orange') return 'green';
    return 'green';
}

var statusBar = document.getElementById('statusBar');
var currentDate = window.currentDate;
var _nested = {};
var _latestUpdatedAt = null;

window.addEventListener('gleitcast-day-change', function(e) {
    currentDate = e.detail.date;
    if (window.setRegionDate) window.setRegionDate(currentDate);
});

function _applyApiPayload(regionAnalyses) {
    var newNested = {};
    var newestTs = null;
    for (var rid in regionAnalyses) {
        newNested[rid] = {};
        for (var ds in regionAnalyses[rid]) {
            var copy = Object.assign({}, regionAnalyses[rid][ds]);
            if (copy.flyability_tier) copy.flyability_tier = normalizeFlyTier(copy.flyability_tier);
            newNested[rid][ds] = copy;
            if (copy.updated_at && (!newestTs || copy.updated_at > newestTs)) {
                newestTs = copy.updated_at;
            }
        }
    }
    _nested = newNested;
    if (newestTs) {
        _latestUpdatedAt = newestTs;
        var d = new Date(newestTs);
        statusBar.textContent = 'Stand: ' + d.toLocaleString('de-CH');
    }
    if (window.setRegionAnalyses) window.setRegionAnalyses(_nested);
    if (window.setRegionDate) window.setRegionDate(currentDate);
}

// 1) Initial-Load via API
fetch('/api/region-analyses').then(function(r) { return r.json(); }).then(function(data) {
    var regionAnalyses = data.region_analyses || {};
    if (Object.keys(regionAnalyses).length === 0) {
        statusBar.textContent = 'Keine Region-Analysen vorhanden';
        return;
    }
    _applyApiPayload(regionAnalyses);
}).catch(function(err) {
    statusBar.textContent = 'Fehler: ' + err.message;
});

// 2) Refresh on tab focus: holt neue Region-Analysen wenn der User zum Tab zurueckkommt.
//    Eine Analyse laeuft 1x/Tag — Polling reicht voellig, kein Realtime noetig.
function _refetchRegionAnalyses() {
    fetch('/api/region-analyses').then(function(r) { return r.json(); }).then(function(data) {
        var regionAnalyses = data.region_analyses || {};
        if (Object.keys(regionAnalyses).length > 0) {
            _applyApiPayload(regionAnalyses);
        }
    }).catch(function(e) { console.warn('Refetch failed:', e); });
}
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') _refetchRegionAnalyses();
});

// Swipe-to-close on region overlay
var regionOverlay = document.getElementById('regionOverlay');
var regionOverlayClose = document.getElementById('regionOverlayClose');
if (regionOverlay && window._setupSwipeDismiss) {
    window._setupSwipeDismiss(regionOverlay, function () {
        if (regionOverlayClose) regionOverlayClose.click();
    });
}
</script>
{% endblock %}
